openapi: 3.1.0
info:
  title: API TechX Tasks
  version: 2.3.0
  description: API REST para o desafio fullstack da Essentia Group.
  contact:
    name: Glauco Maximo
    email: glaucomaximo@gmail.com
servers:
  - url: http://localhost:3333
    description: Desenvolvimento local
tags:
  - name: Saude
  - name: Observabilidade
  - name: Autenticacao
  - name: Tarefas
paths:
  /liveness:
    get:
      tags: [Saude]
      summary: Liveness do processo
      responses:
        "200":
          description: O processo da API esta vivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readiness:
    get:
      tags: [Saude]
      summary: Readiness do servico
      responses:
        "200":
          description: API, MySQL e MongoDB estao prontos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          description: Falha na checagem de dependencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      tags: [Saude]
      summary: Endpoint legado de saude
      responses:
        "200":
          description: Resposta leve de saude para compatibilidade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /metrics:
    get:
      tags: [Observabilidade]
      summary: Metricas operacionais em formato Prometheus
      responses:
        "200":
          description: Texto de metricas para coleta por Prometheus ou agente compativel.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      tags: [Autenticacao]
      summary: Criar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario criado e sessao JWT iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      tags: [Autenticacao]
      summary: Entrar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessao JWT iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          description: Conta temporariamente bloqueada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password-reset/request:
    post:
      tags: [Autenticacao]
      summary: Solicitar recuperacao de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Solicitacao aceita sem revelar existencia da conta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken:
                    type: string
                    description: Disponivel apenas em desenvolvimento local.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Autenticacao]
      summary: Confirmar recuperacao de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Senha alterada e sessoes anteriores revogadas.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/mfa/setup:
    post:
      tags: [Autenticacao]
      summary: Iniciar MFA TOTP
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Segredo TOTP criado para pareamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/mfa/enable:
    post:
      tags: [Autenticacao]
      summary: Habilitar MFA TOTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaEnableRequest"
      responses:
        "204":
          description: MFA habilitado.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/logout:
    post:
      tags: [Autenticacao]
      summary: Revogar sessao atual
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sessao atual revogada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/logout-all:
    post:
      tags: [Autenticacao]
      summary: Revogar todas as sessoes
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Todas as sessoes do usuario foram revogadas.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/me:
    get:
      tags: [Autenticacao]
      summary: Consultar usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/tasks:
    get:
      tags: [Tarefas]
      summary: Listar tarefas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista ordenada de tarefas do usuario autenticado.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Tarefas]
      summary: Criar tarefa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Tarefa criada.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Tarefas]
      summary: Buscar tarefa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tarefa encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Tarefas]
      summary: Atualizar tarefa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tarefas]
      summary: Atualizar tarefa parcialmente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tarefas]
      summary: Remover tarefa
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Tarefa removida.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Identificador de correlacao da requisicao.
      schema:
        type: string
  responses:
    BadRequest:
      description: Requisicao invalida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Autenticacao ausente ou invalida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflito com o estado atual do recurso.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso nao encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Limite de requisicoes excedido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
    AuthenticatedUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
    AuthSession:
      type: object
      required: [token, tokenId, expiresAt, user]
      properties:
        token:
          type: string
        tokenId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        mfaCode:
          type: string
          minLength: 6
          maxLength: 6
      additionalProperties: true
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      additionalProperties: true
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: true
    MfaSetupResponse:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
          format: uri
    MfaEnableRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
      additionalProperties: true
    Task:
      type: object
      required: [id, title, description, completed, metadata, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 180
        description:
          type:
            - string
            - "null"
        completed:
          type: boolean
        metadata:
          $ref: "#/components/schemas/TaskMetadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskMetadata:
      type: object
      required: [priority, dueDate, tags, notes]
      properties:
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        dueDate:
          type:
            - string
            - "null"
          format: date
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        notes:
          type:
            - string
            - "null"
          maxLength: 1000
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type:
            - string
            - "null"
        completed:
          type: boolean
          default: false
        metadata:
          $ref: "#/components/schemas/TaskMetadata"
      additionalProperties: true
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type:
            - string
            - "null"
        completed:
          type: boolean
        metadata:
          $ref: "#/components/schemas/TaskMetadata"
      minProperties: 1
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [message, requestId]
      properties:
        message:
          type: string
        requestId:
          type: string
        details: {}
