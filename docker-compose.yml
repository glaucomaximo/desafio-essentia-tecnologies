services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techx_tasks}
      MYSQL_USER: ${MYSQL_USER:-techx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-techx}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-techx_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-techx_mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-techx_tasks}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: techx-tasks-api
      APP_VERSION: ${APP_VERSION:-2.1.1}
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-techx}
      DB_PASSWORD: ${MYSQL_PASSWORD:-techx}
      DB_NAME: ${MYSQL_DATABASE:-techx_tasks}
      JWT_SECRET: ${JWT_SECRET:-desenvolvimento-local-jwt-secret-com-32-caracteres}
      JWT_ISSUER: ${JWT_ISSUER:-techx-tasks-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-techx-tasks-web}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-techx_mongo}:${MONGO_ROOT_PASSWORD:-techx_mongo}@mongo:27017/${MONGO_DATABASE:-techx_tasks}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DATABASE:-techx_tasks}
      MONGO_TASK_METADATA_COLLECTION: ${MONGO_TASK_METADATA_COLLECTION:-task_metadata}
      MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-5000}
    ports:
      - "${API_PORT:-3333}:3333"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/readiness').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mysql-data:
  mongo-data:
